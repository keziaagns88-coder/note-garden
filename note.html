<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筆記｜Kezia 的筆記花園</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header id="site-header" class="site-header"></header>

  <!-- 單篇筆記頁：note.html?id=<筆記ID>，內容來自 notes/<筆記ID>.md -->
  <main id="main" class="wrap note-page">
    <nav class="breadcrumb" id="breadcrumb" aria-label="目前位置"></nav>
    <div class="note-layout">
      <article class="note" id="note">
        <header class="specimen-label note-label" id="note-label" hidden></header>
        <div class="prose" id="note-body">
          <p class="loading">正在讀取筆記⋯</p>
        </div>
      </article>
      <aside class="note-aside" id="note-aside" aria-label="相關筆記"></aside>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <noscript><p class="wrap noscript">這個網站需要開啟 JavaScript 才能顯示筆記。</p></noscript>
  <script src="assets/vendor/marked.umd.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/note.js"></script>
</body>
</html>
